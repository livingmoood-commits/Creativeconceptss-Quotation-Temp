<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1E1A15; --dark2:#2a231c; --gold:#B8975A; --gold-dim:#8f7546; --cream:#F3EFEA;
    --muted:#6B5E4E; --green:#2C5F3A; --red:#c0392b; --white:#ffffff; --border:#e7e0d4;
    --bounce:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Cairo',sans-serif; background:var(--cream); color:var(--dark); display:flex; min-height:100vh; overflow-x:hidden; }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; }

  .sidebar{ width:235px; background:var(--dark); color:#f0e6d8; flex-shrink:0; display:flex; flex-direction:column; padding:22px 0; position:sticky; top:0; height:100vh; overflow-y:auto; transition:transform .35s var(--bounce), width .3s var(--bounce); }

  /* ===== Sidebar collapse (desktop) ===== */
  .sidebar-toggle{ position:absolute; top:14px; left:10px; width:28px; height:28px; border-radius:50%; background:var(--gold); color:var(--dark); border:2px solid var(--dark); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; font-weight:800; line-height:1; z-index:5; transition:transform .3s var(--bounce), background .2s, color .2s; }
  .sidebar-toggle:hover{ background:var(--gold-dim); color:#fff; }
  .sidebar-toggle:active{ transform:scale(.88); }
  .sidebar.collapsed .sidebar-toggle{ transform:rotate(180deg); }
  .sidebar.collapsed .sidebar-toggle:active{ transform:rotate(180deg) scale(.88); }
  .sidebar.collapsed{ width:72px; }
  .sidebar.collapsed .brand{ padding:0 8px; }
  .sidebar.collapsed .brand h1,
  .sidebar.collapsed .brand p,
  .sidebar.collapsed .nav .label,
  .sidebar.collapsed .user-menu-btn .label{ display:none; }
  .sidebar.collapsed .nav button,
  .sidebar.collapsed .user-menu-btn{ justify-content:center; padding:11px 0; }
  .sidebar.collapsed .nav button:hover{ transform:none; }
  .sidebar.collapsed .sep{ margin:10px 16px; }
  .brand{ text-align:center; margin-bottom:22px; padding:0 14px; }
  .brand .logo{ width:54px; height:54px; border-radius:14px; background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; margin:0 auto 10px; font-family:'IBM Plex Mono',monospace; }
  .brand h1{ font-size:16px; font-weight:800; letter-spacing:.5px; }
  .brand p{ font-size:10.5px; color:var(--gold); margin-top:3px; letter-spacing:.5px; }
  .nav{ flex:1; display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav button{ all:unset; cursor:pointer; padding:11px 14px; border-radius:8px; font-size:13.5px; color:#cbbfae; display:flex; align-items:center; gap:9px; transition:background .2s, color .2s, transform .25s var(--bounce); font-family:inherit; }
  .nav button:hover{ background:var(--dark2); color:#fff; transform:translateX(-5px); }
  .nav button.active{ background:var(--gold); color:var(--dark); font-weight:700; animation:navPop .4s var(--bounce); }
  .nav .icon{ font-size:15px; width:18px; text-align:center; }
  .nav .sep{ height:1px; background:#3a3129; margin:10px 12px; }
  @keyframes navPop{ 0%{ transform:scale(.88); } 55%{ transform:scale(1.06); } 100%{ transform:scale(1); } }

  .hamburger{ display:none; flex-direction:column; justify-content:center; gap:4px; width:38px; height:38px; border:none; background:var(--dark); border-radius:8px; cursor:pointer; flex-shrink:0; padding:0; transition:transform .2s var(--bounce); }
  .hamburger span{ display:block; width:18px; height:2px; background:#f0e6d8; margin:0 auto; border-radius:2px; transition:transform .25s var(--bounce), opacity .2s; }
  .hamburger:active{ transform:scale(.88); }
  .hamburger.open span:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .hamburger.open span:nth-child(2){ opacity:0; }
  .hamburger.open span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
  .sidebar-overlay{ display:none; }

  .main{ flex:1; padding:26px 34px; max-width:1280px; min-width:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .topbar h2{ font-size:23px; font-weight:800; }
  .topbar p{ color:var(--muted); font-size:13px; margin-top:3px; }
  .badge-live{ background:#e6f4ea; color:var(--green); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; white-space:nowrap; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(185px,1fr)); gap:14px; margin-bottom:22px; }
  .card{ background:var(--white); border:1px solid var(--border); border-radius:12px; padding:17px; text-align:center; transition:transform .25s var(--bounce), box-shadow .25s var(--bounce), border-color .2s; }
  .card:hover{ transform:translateY(-4px) scale(1.02); box-shadow:0 12px 26px rgba(30,26,21,.10); border-color:var(--gold); }
  .card .label{ color:var(--muted); font-size:12px; font-weight:600; margin-bottom:7px; }
  .card .value{ font-size:22px; font-weight:800; }
  .card .value.green{ color:var(--green); } .card .value.red{ color:var(--red); } .card .value.gold{ color:var(--gold-dim); }

  .panel{ background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .panel h3{ font-size:15px; font-weight:700; margin-bottom:14px; border-right:4px solid var(--gold); padding-right:10px; display:flex; justify-content:space-between; align-items:center; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ background:var(--dark); color:#fff; padding:9px 8px; text-align:center; font-weight:600; }
  td{ padding:8px 8px; text-align:center; border-bottom:1px solid var(--border); }
  tr:nth-child(even) td{ background:#fbf9f5; }
  tr{ transition:background .15s; }
  tbody tr:hover td{ background:#f3ead9; }
  .tbl-wrap{ overflow-x:auto; }
  .tbl-wrap-scroll{ overflow:auto; max-height:520px; }
  .tbl-wrap-scroll thead th{ position:sticky; top:0; z-index:1; }
  .empty{ text-align:center; color:var(--muted); padding:24px; font-size:13px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:980px){ .grid2{ grid-template-columns:1fr; } }

  /* ===== Mobile: hamburger off-canvas sidebar ===== */
  @media(max-width:900px){
    .hamburger{ display:flex; }
    .sidebar-toggle{ display:none; }
    .sidebar{
      position:fixed; inset-inline-end:0; top:0; bottom:0; z-index:1000;
      width:250px; max-width:82vw; transform:translateX(100%);
      box-shadow:-14px 0 40px rgba(0,0,0,.35);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-overlay{
      display:block; position:fixed; inset:0; background:rgba(20,17,13,.55); z-index:999;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .sidebar-overlay.open{ opacity:1; pointer-events:auto; }
    .main{ padding:16px 14px; max-width:100%; }
    .topbar{ align-items:center; }
  }
  @media(max-width:560px){
    .topbar h2{ font-size:19px; }
    .cards{ grid-template-columns:1fr 1fr; gap:10px; }
    .form-row, .form-row3{ grid-template-columns:1fr; }
    .panel{ padding:15px; }
    .card{ padding:13px; }
    .card .value{ font-size:18px; }
  }
  @media(max-width:380px){
    .cards{ grid-template-columns:1fr; }
  }

  form .field{ margin-bottom:13px; }
  form label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  form select, form input, form textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fdfcfa; transition:border-color .2s, box-shadow .2s; }
  form select:focus, form input:focus, form textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,151,90,.18); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .btn{ display:inline-block; padding:10px 22px; border:none; border-radius:8px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:transform .22s var(--bounce), box-shadow .22s var(--bounce), background .2s, color .2s; }
  .btn:hover{ transform:translateY(-2px) scale(1.03); }
  .btn:active{ transform:scale(.92); }
  .btn-primary{ background:var(--gold); color:var(--dark); }
  .btn-primary:hover{ background:var(--gold-dim); color:#fff; box-shadow:0 8px 18px rgba(184,151,90,.35); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--dark); }
  .btn-sm{ padding:5px 11px; font-size:12px; border-radius:6px; }
  .btn-danger{ background:#fbe2e2; color:var(--red); border:none; }
  .btn-danger:hover{ background:#f8caca; box-shadow:0 6px 14px rgba(192,57,43,.25); }
  .msg{ font-size:13px; margin-top:10px; padding:9px 12px; border-radius:8px; display:none; }
  .msg.ok{ background:#e6f4ea; color:var(--green); display:block; animation:msgIn .3s var(--bounce); }
  .msg.err{ background:#fbe2e2; color:var(--red); display:block; animation:msgIn .3s var(--bounce); }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }

  /* ===== مصاريف يومية: بار التاريخ + مربعات الإدخال ===== */
  .d-date-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px; background:var(--cream); border:1px solid var(--border); border-radius:10px; }
  .d-date-bar label{ font-size:13px; font-weight:700; color:var(--muted); }
  .d-input{ width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fdfcfa; color:var(--dark); transition:border-color .2s, box-shadow .2s; }
  .d-input:hover{ border-color:#d8cdb8; }
  .d-input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,151,90,.18); background:#fff; }
  .d-input::placeholder{ color:#b7ac9a; }
  #d-date-bar{ direction:ltr; text-align:center; font-weight:700; width:auto; min-width:170px; }
  #d-body td{ padding:6px 8px; }
  /* دروب-داون مشاريع مبني بالكود بالكامل (مش <datalist> الأصلي) — عشان كروم كان بيخلط بينه وبين اقتراح باسورد محفوظ */
  .d-suggest-box{ display:none; position:absolute; top:calc(100% + 4px); right:0; left:0; z-index:50; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 24px rgba(30,26,21,.16); max-height:220px; overflow-y:auto; text-align:right; }
  .d-suggest-box.open{ display:block; }
  .d-suggest-item{ padding:9px 12px; font-size:13px; cursor:pointer; }
  .d-suggest-item:hover{ background:var(--cream); }

  .filters{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .moves-filter{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .moves-filter button{ all:unset; cursor:pointer; padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--cream); border:1px solid var(--border); transition:background .2s, color .2s, border-color .2s, transform .2s var(--bounce); }
  .moves-filter button:hover{ border-color:var(--gold); color:var(--dark); }
  .moves-filter button.active{ background:var(--dark); color:#fff; border-color:var(--dark); }
  .moves-filter button:active{ transform:scale(.94); }
  .filters select, .filters input{ padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill.dep{ background:#e6f4ea; color:var(--green); } .pill.exp{ background:#fbe2e2; color:var(--red); }

  .spinner{ display:inline-block; width:13px; height:13px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-row{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:12px; animation:fadeIn .25s ease; }
  .loading-row::before{ content:''; width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* page content transition */
  #content{ animation:none; }
  #content.page-anim{ animation:contentIn .45s var(--bounce); }
  @keyframes contentIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }

  .dyn-row{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
  .dyn-row.material{ grid-template-columns:2fr 1fr 1fr 1fr auto auto; }
  .dyn-row.labor{ grid-template-columns:2fr 1fr auto auto auto; }
  .dyn-add{ margin-top:4px; }
  .dyn-row-cost{ font-size:12px; font-weight:700; color:var(--gold-dim); text-align:center; white-space:nowrap; padding:0 2px; }
  .evening-row{ display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin:-2px 0 10px 0; padding-inline-start:14px; border-inline-start:2px solid var(--border); }
  .evening-row input{ background:#fff8ec; }
  .subtotal-line{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 4px; border-top:1px dashed var(--border); margin-top:6px; }
  .subtotal-line b{ color:var(--dark); }
  .subtotal-line.grand{ border-top:2px solid var(--gold); margin-top:10px; padding-top:10px; font-size:14.5px; font-weight:700; }
  .quick-links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .setup-note{ background:#fff8e6; border:1px solid #f0dca0; color:#7a5e12; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:18px; }

  .login-wrap{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:

  .login-box{ width:100%; max-width:340px; background:rgba(255,255,255,.97); backdrop-filter:blur(6px); border-radius:14px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,.55); position:relative; z-index:1; animation:modalPop .5s var(--bounce); }
  .login-box .logo{ width:54px; height:54px; border-radius:14px; background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; margin:0 auto 12px; font-family:'IBM Plex Mono',monospace; }
  .login-box h1{ text-align:center; font-size:17px; font-weight:800; margin-bottom:2px; }
  .login-box p.sub{ text-align:center; font-size:11.5px; color:var(--gold-dim); margin-bottom:20px; letter-spacing:.5px; }
  #appRoot{ display:none; width:100%; }

  .btn-dark{ background:var(--dark); color:#D4B483; }
  .btn-dark:hover{ background:var(--dark2); color:#fff; }
  .btn-dark:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-success{ background:#e6f4ea; color:var(--green); border:1.5px solid var(--green); }
  .btn-success:hover{ background:#d5eedc; }
  .btn-success.active{ background:var(--green); color:#fff; box-shadow:0 6px 14px rgba(44,95,58,.3); }

  /* ===== Quotation (عروض الأسعار) — full editor/preview ===== */
  .q-steps{ display:flex; margin-bottom:18px; border-radius:8px; overflow:hidden; box-shadow:0 4px 20px rgba(30,26,21,.08); }
  .q-steps .step{ flex:1; text-align:center; padding:11px 6px; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--white); border-bottom:3px solid var(--border); cursor:default; transition:all .2s; }
  .q-steps .step.active{ color:var(--gold); border-color:var(--gold); }
  .q-steps .step.done{ color:var(--green); border-color:var(--green); cursor:pointer; }
  .q-steps .step.done:hover{ background:#f0ebe3; }
  .p-filter-tabs .step{ cursor:pointer; transition:background .2s, color .2s, border-color .3s, transform .18s var(--bounce); }
  .p-filter-tabs .step:hover{ background:#f0ebe3; }
  .p-filter-tabs .step:active{ transform:scale(.96); }
  .p-filter-tabs .step.active{ color:var(--gold); border-color:var(--gold); background:#fbf7ef; animation:navPop .4s var(--bounce); }

  .q-banner{ display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between; }
  .q-info-box{ background:var(--cream); border-right:4px solid var(--gold); padding:11px 16px; border-radius:5px; display:flex; flex-direction:column; gap:8px; flex:1; min-width:260px; }
  .q-info-row{ display:flex; align-items:center; gap:8px; }
  .q-info-row label{ font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .q-info-row input{ flex:1; border:1px solid var(--border); border-radius:5px; padding:6px 9px; background:#fff; font-family:inherit; font-size:14px; font-weight:700; color:var(--dark); min-width:140px; }
  .q-dollar-inline{ display:flex; align-items:center; gap:8px; }
  .q-dollar-inline input{ width:80px; padding:7px 9px; font-size:14px; font-weight:700; border:1px solid var(--border); border-radius:5px; }
  .q-dollar-inline input[type="date"]{ width:140px; direction:ltr; text-align:center; }
  .q-side-col{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }

  .q-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:14px; }
  table.q-tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
  .q-tbl thead tr{ background:var(--green); color:#fff; }
  .q-tbl thead th{ padding:9px 8px; font-weight:600; text-align:right; white-space:nowrap; }
  .q-tbl tbody tr{ border-bottom:1px solid var(--border); }
  .q-tbl tbody tr:hover{ background:#faf7f3; }
  .q-tbl td{ padding:7px 6px; vertical-align:middle; }
  .q-tbl td:has(textarea){ vertical-align:top; }
  .q-tbl td input, .q-tbl td textarea{ background:#fff; border:1.5px solid var(--border); border-radius:5px; font-family:inherit; font-size:13px; color:var(--dark); width:100%; padding:5px 7px; outline:none; direction:rtl; text-align:right; }
  .q-tbl td input.ltr-num{ direction:ltr; text-align:left; }
  .q-tbl td input:focus, .q-tbl td textarea:focus{ border-color:var(--gold); }
  .q-tbl td textarea{ resize:vertical; min-height:130px; line-height:1.6; }
  .q-tbl th:nth-child(4){ min-width:260px; }
  .q-tbl td.num-cell{ font-weight:700; white-space:nowrap; direction:ltr; text-align:left; }

  .q-discount-card{ background:var(--cream); border:1px solid var(--border); border-radius:6px; padding:14px 16px; margin:16px 0; }
  .q-discount-card .dc-title{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.5px; margin-bottom:10px; }
  .q-dc-fields{ display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end; }
  .q-dc-field{ display:flex; flex-direction:column; gap:5px; }
  .q-dc-field label{ font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.5px; }
  .q-dc-input-wrap{ display:flex; align-items:center; gap:8px; }
  .q-dc-input-wrap input{ width:110px; padding:8px 10px; border:1.5px solid var(--border); border-radius:6px; background:#fff; font-family:inherit; font-size:14px; font-weight:700; color:var(--dark); direction:ltr; text-align:left; outline:none; }
  .q-dc-input-wrap input:focus{ border-color:var(--gold); }
  .q-dc-suffix{ font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .q-dc-summary{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
  .q-dc-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0; color:var(--muted); }
  .q-dc-row.total{ font-weight:700; color:var(--green); }
  .q-dc-row .val{ font-weight:700; color:var(--dark); direction:ltr; }

  .q-grand-bar{ background:var(--dark); color:#D4B483; padding:13px 20px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700; margin-bottom:16px; }
  .q-grand-bar .amt{ font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--gold); }

  .q-clist .c-item{ display:flex; align-items:center; justify-content:flex-start; flex-wrap:wrap; gap:14px; padding:13px 14px; background:var(--cream); border:1px solid var(--border); border-radius:6px; margin-bottom:8px; transition:border-color .2s, background .2s, transform .22s var(--bounce), box-shadow .22s var(--bounce); }
  .q-clist .c-item:hover{ border-color:var(--gold); background:#ece6dd; transform:translateY(-2px); box-shadow:0 8px 20px rgba(30,26,21,.08); }
  .q-clist .ci-info{ flex:0 1 auto; min-width:0; max-width:100%; cursor:pointer; }
  .q-clist .ci-name{ font-weight:700; font-size:14px; }
  .q-clist .ci-meta{ font-size:11px; color:var(--muted); margin-top:2px; }

<script>
/* ============ ⚠️ اضبط رابط الـ Web App هنا بعد النشر (Deploy) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzstJuI5EKdabQmOIechewiCvCnJ2MEHgDubQMFRmZPqqZG7rBByy6OUrfLEIV9zl7U/exec';

/* ================= API helper ================= */
async function apiGet(action, params) {
  params = params || {};
  const qs = new URLSearchParams({ action, ...Object.fromEntries(Object.entries(params).map(([k,v]) => [k, typeof v === 'object' ? JSON.stringify(v) : v])) });
  const res = await fetch(API_URL + '?' + qs.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // بيتفادى CORS preflight
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
function fmt(n){ return (Number(n)||0).toLocaleString('en-US', {maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0,10); }
// آخر يوم شغل فعلي (بيتخطى الجمعة — لو النهاردة السبت مثلاً، بيرجع الخميس مش الجمعة)
function lastWorkingDayStr(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  if (d.getDay() === 5) d.setDate(d.getDate() - 1); // 5 = الجمعة
  return d.toISOString().slice(0,10);
}
function weekAgoStr(){ const d=new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); }
// بيحدّد لو الخطأ سببه فصل النت (مش مشكلة في السيرفر أو في الداتا) — بيغطي رسائل
// الفشل المختلفة اللي كل متصفح بيرميها لما مفيش اتصال (كروم/إيدج، فايرفوكس، سفاري)
function _isNetworkError(msg){
  return !navigator.onLine || /Failed to fetch|NetworkError|Load failed|ERR_INTERNET_DISCONNECTED|ERR_NETWORK/i.test(String(msg || ''));
}
// أول ما النت يقطع: بنلوّن شارة "متصل" باللون الأحمر ونغيّر النص.
// أول ما النت يرجع: بنعمل reload تلقائي كامل للصفحة، عشان كل حاجة تتحمّل تاني من الأول بشكل نضيف.
window.addEventListener('offline', () => {
  const b = document.getElementById('liveBadge');
  if (b) { b.textContent = 'مفيش اتصال بالإنترنت'; b.style.background = '#fbe2e2'; b.style.color = '#c0392b'; }
});
window.addEventListener('online', () => { location.reload(); });
// الأسبوع عندنا بيبدأ السبت وينتهي الخميس (الجمعة أجازة) — بيرجع {from, to} لأقرب سبت وخميس اللي بعده
function currentWeekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=Sun ... 6=Sat
  const diffToSat = (day + 1) % 7; // عدد الأيام من آخر سبت لحد النهاردة
  const sat = new Date(now); sat.setDate(now.getDate() - diffToSat);
  const thu = new Date(sat); thu.setDate(sat.getDate() + 5);
  return { from: sat.toISOString().slice(0,10), to: thu.toISOString().slice(0,10) };
}
function checkApiConfigured(){
  if (API_URL.indexOf('PASTE_YOUR') === 0) {
    document.getElementById('liveBadge').textContent = 'مش متصل';
    document.getElementById('liveBadge').style.background = '#fbe2e2';
    document.getElementById('liveBadge').style.color = '#c0392b';
    document.getElementById('content').innerHTML = `<div class="setup-note">
      ⚠️ لازم الأول تحط رابط الـ Web App بتاع الـ Apps Script في المتغيّر <code>API_URL</code> فوق في الكود، بعد ما تعمل Deploy &gt; New deployment &gt; Web app (Execute as: Me, Who has access: Anyone).
    </div>`;
    return false;
  }
  return true;
}

/* ================= Router ================= */
const PAGES = {
  dashboard:    { title:'نظرة عامة', sub:'ملخص شامل لكل حاجة في المصنع', render: renderDashboard },
  employees:    { title:'الموظفين', sub:'من شيت "تفاصيل المرتبات" بتاع الشهر الحالي مباشرة', render: renderEmployees },
  logHours:     { title:'ساعات وسهرات', sub:'سجّل شغل أي صنايعي على أي مشروع', render: renderLogHours },
  distribution: { title:'توزيع تكلفة المرتبات', sub:'مين شغل فين، وكام ساعة، وسهر إمتى', render: renderDistribution },
  treasury:     { title:'الخزنة — Cash Flow', sub:'الرصيد الحالي، الداخل والخارج، الإيداعات والمصاريف', render: renderTreasury },
  dailyExpenses:{ title:'مصاريف يومية', sub:'سجّل كل مصاريف اليوم سطر سطر — بتتسجل في شيت اليوم بتاعك مباشرة', render: renderDailyExpenses },
  projects:     { title:'المشاريع', sub:'تكلفة كل مشروع بالتفصيل', render: renderProjects },
  products:     { title:'تكلفة المنتجات', sub:'خامات + عمالة لكل منتج، بتتحمّل على المشروع', render: renderProducts },
  fixedExp:     { title:'المصاريف الثابتة', sub:'إيجار / كهرباء / إلخ — وطريقة توزيعها على المشاريع', render: renderFixedExp },
  quotation:    { title:'Quotations', sub:'قائمة العملاء وعروض الأسعار', render: renderQuotation },
  debtors:      { title:'Payment Statements', sub:'متابعة تحصيل الدفعات من العملاء', render: renderDebtors }
};

/* ================= Sidebar (mobile off-canvas + desktop collapse) ================= */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
  document.getElementById('hamburgerBtn').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.getElementById('hamburgerBtn').classList.remove('open');
}
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('open')) closeSidebar(); else openSidebar();
}
function toggleSidebarCollapse(){
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  try{ localStorage.setItem('lm_sidebarCollapsed', sb.classList.contains('collapsed') ? '1' : '0'); }catch(e){}
}
(function restoreSidebarCollapse(){
  try{
    if (localStorage.getItem('lm_sidebarCollapsed') === '1') {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  }catch(e){}
})();

document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return; goTo(btn.dataset.page);
  closeSidebar(); // يقفل القايمة تلقائي بعد الاختيار في وضع الموبايل
});
// كل مرة ندخل صفحة، بيتزود التوكن ده. أي صفحة قديمة لسه بتحمّل (fetch) بتتاكد قبل
// ما تكتب في الـ DOM إن التوكن بتاعها لسه هو الحالي — لو المستخدم دخل صفحة تانية
// قبل ما تخلص، بتلاقي التوكن اتغير فبتلغي نفسها من غير ما تكتب حاجة فوق الصفحة الجديدة
let _navToken = 0;
function goTo(page) {
  if (!PAGES[page]) page = 'dashboard';
  const token = ++_navToken;
  sessionStorage.setItem('lm_currentPage', page);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('pageTitle').textContent = PAGES[page].title;
  document.getElementById('pageSub').textContent = PAGES[page].sub;
  if (!checkApiConfigured()) return;
  document.getElementById('content').innerHTML = '<div class="loading-row">جاري التحميل...</div>';
  PAGES[page].render(token);
}
function isStaleNav(token){ return token !== undefined && token !== _navToken; }
function showError(err){
  const msg = (err && err.message) || String(err);
  if (_isNetworkError(msg)) {
    document.getElementById('content').innerHTML = `<div class="panel"><div class="msg err" style="display:block;">
      ⚠️ السبب مفيش اتصال بالإنترنت دلوقتي. هتترفريش الصفحة تلقائيًا أول ما النت يرجع.
    </div></div>`;
    // بعض الأجهزة بتاخد وقت تبعت حدث "online" فعليًا حتى بعد ما النت يرجع، فبنعمل
    // فحص احتياطي كل 3 ثواني: أول ما navigator.onLine يبقى true تاني، نعمل reload.
    if (!window._netRetryTimer) {
      window._netRetryTimer = setInterval(() => { if (navigator.onLine) { clearInterval(window._netRetryTimer); location.reload(); } }, 3000);
    }
    return;
  }

      } catch(err){ msg.className='msg err'; msg.textContent='خطأ: '+(err.message||err); btn.disabled=false; btn.textContent=_editingMoveId?'تحديث الحركة':'حفظ الحركة'; }

function editTreasuryMove(id){

async function deleteTreasuryMoveConfirm(id){

/* ================= مصاريف يومية — إدخال سريع سطر لكل مصروف
 * كل سطر بيتسجل في نفس الشيت الحقيقي بتاع "📋 المصاريف" (ملف مستقل بره الداشبورد،
 * فيه شيت لكل يوم بيتعمل تلقائي بسكريبت تاني) — بنفس الأعمدة بالظبط: وصف المصاريف |
 * المبلغ | التاريخ | المشروع الموجه. مفيش لمس مباشر لشيت "الخزنة" من هنا، عشان
 * لو فيه مزامنة تلقائية موجودة أصلاً بتاخد من الشيت ده وتحدّث الخزنة، منعملش خصم مرتين. ================= */
// _noAutofill: اسم شبه-عشوائي لكل حقل، بيتغيّر كل مرة الجدول بيترسم، عشان كروم
// ميقترحش قيم قديمة (زي أسماء موظفين اتكتبت في صفحات تانية) جوه حقول المصاريف دي.
function _noAutofill(prefix){ return prefix + '-' + Math.random().toString(36).slice(2, 10); }

let DSTATE = { rows: [], date: lastWorkingDayStr() };
function dNewRow(){ return { _id: Math.random(), desc: '', amount: '', project: '' }; }
function dTotal(){ return DSTATE.rows.reduce((s, r) => s + qNum(r.amount), 0); }

async function renderDailyExpenses(token) {
  try {
    const [{ projects }, log] = await Promise.all([
      apiGet('listProjects'),
      apiGet('getDailyExpenses', { date: DSTATE.date })
    ]);
    if (isStaleNav(token)) return;
    DSTATE.rows = [dNewRow(), dNewRow(), dNewRow()];
    DPROJECT_NAMES = Array.from(new Set([...projects, 'مصروفات عامة']));
    document.getElementById('content').innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
          <h3 style="margin:0;">مصاريف اليوم — سطر لكل مصروف</h3>
          <div style="font-weight:800;font-size:15px;">الإجمالي: <span id="d-total" style="color:var(--red);">0</span> ج</div>
        </div>
        <div class="d-date-bar">
          <label for="d-date-bar">تاريخ المصاريف دي:</label>
          <input type="date" id="d-date-bar" class="d-input" autocomplete="off" value="${DSTATE.date}">
          <span style="font-size:12px;color:var(--muted);">هيتسجل جنب كل مصروف في الشيت تلقائي</span>
        </div>
        <div class="tbl-wrap tbl-wrap-scroll">
          <table>
            <thead><tr><th style="width:26px;">#</th><th>وصف المصروف</th><th style="width:120px;">المبلغ</th><th style="width:190px;">المشروع الموجه</th><th></th></tr></thead>
            <tbody id="d-body"></tbody>
          </table>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;">
          <button type="button" class="btn btn-outline btn-sm" id="d-add-row">+ إضافة سطر</button>
          <button type="button" class="btn btn-primary" id="d-save-all">حفظ</button>
          <div class="msg" id="d-msg"></div>
        </div>
      </div>
      <div class="panel">
        <h3 id="d-log-heading">مصاريف اليوم المسجلة فعليًا في الشيت (${DSTATE.date})</h3>

    document.getElementById('d-date-bar').addEventListener('change', dOnDateBarChange);
  } catch(err){ showError(err); }
}
async function dOnDateBarChange(e){
  DSTATE.date = e.target.value || todayStr();
  document.getElementById('d-log-heading').textContent = `مصاريف اليوم المسجلة فعليًا في الشيت (${DSTATE.date})`;
  const box = document.getElementById('d-today-box');
  box.innerHTML = '<div class="loading-row">جاري التحميل...</div>';
  try {
    const log = await apiGet('getDailyExpenses', { date: DSTATE.date });
    dRenderTodayLog(log.rows || []);
  } catch(err){ box.innerHTML = `<div class="msg err" style="display:block;">خطأ: ${err.message||err}</div>`; }
}
let DPROJECT_NAMES = [];
function dRenderRows(){
  const tb = document.getElementById('d-body'); if (!tb) return;
  tb.innerHTML = DSTATE.rows.map((r, i) => `
    <tr>
      <td style="text-align:center;color:var(--muted);font-size:11px;">${i + 1}</td>
      <td><input type="text" class="d-input" autocomplete="off" data-lpignore="true" data-1p-ignore name="${_noAutofill('desc')}" value="${qEsc(r.desc)}" onchange="dSetField(${r._id},'desc',this.value)" placeholder="مثال: فطار، بنزين، مسامير..."></td>
      <td><input type="text" class="d-input ltr-num" autocomplete="off" data-lpignore="true" data-1p-ignore inputmode="numeric" name="${_noAutofill('amount')}" value="${r.amount || ''}" onchange="dSetField(${r._id},'amount',this.value)" onkeypress="return /[0-9.]/.test(event.key)"></td>
      <td style="position:relative;">
        <input type="text" class="d-input" autocomplete="off" data-lpignore="true" data-1p-ignore
          name="${_noAutofill('project')}" id="d-proj-${r._id}" value="${qEsc(r.project)}" placeholder="مصروفات عامة"
          oninput="dShowProjectSuggestions(${r._id}, this)"
          onfocus="dShowProjectSuggestions(${r._id}, this)"
          onblur="setTimeout(()=>dHideProjectSuggestions(${r._id}), 150)"
          onchange="dSetField(${r._id},'project',this.value)">
        <div class="d-suggest-box" id="d-proj-box-${r._id}"></div>
      </td>
      <td><button class="btn btn-sm btn-danger" onclick="dDelRow(${r._id})">✕</button></td>
    </tr>`).join('');
  document.getElementById('d-total').textContent = fmt(dTotal());
}
function dShowProjectSuggestions(rowId, inputEl){
  const box = document.getElementById('d-proj-box-' + rowId); if (!box) return;
  const q = String(inputEl.value || '').trim().toLowerCase();
  const list = DPROJECT_NAMES.filter(p => !q || p.toLowerCase().includes(q)).slice(0, 8);
  if (!list.length){ box.classList.remove('open'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(p => `<div class="d-suggest-item" onmousedown="event.preventDefault();dPickProjectSuggestion(${rowId}, '${p.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">${qEsc(p)}</div>`).join('');
  box.classList.add('open');
}
function dHideProjectSuggestions(rowId){
  const box = document.getElementById('d-proj-box-' + rowId);
  if (box) box.classList.remove('open');
}
function dPickProjectSuggestion(rowId, value){
  dHideProjectSuggestions(rowId);
  dSetField(rowId, 'project', value);
}
function dSetField(id, f, v){
  const r = DSTATE.rows.find(r => r._id === id); if (!r) return;
  r[f] = f === 'amount' ? qNum(v) : v;
  dRenderRows();
}
function dDelRow(id){
  DSTATE.rows = DSTATE.rows.filter(r => r._id !== id);
  if (!DSTATE.rows.length) DSTATE.rows = [dNewRow()];
  dRenderRows();
}
async function dSaveAll(){
  const valid = DSTATE.rows.filter(r => String(r.desc).trim() && qNum(r.amount) > 0);
  const msg = document.getElementById('d-msg'); const btn = document.getElementById('d-save-all');
  if (!valid.length){ msg.className = 'msg err'; msg.textContent = 'من فضلك اكتب وصف ومبلغ لسطر واحد على الأقل'; return; }
  btn.disabled = true; msg.className = 'msg'; msg.innerHTML = '<span class="spinner"></span>جاري الحفظ...';
  let saved = 0, total = 0;
  try {
    for (const r of valid) {
      const row = { desc: String(r.desc).trim(), amount: qNum(r.amount), project: String(r.project || '').trim() || 'مصروفات عامة', date: DSTATE.date };
      await apiPost('addDailyExpenseRow', { row });
      saved++; total += qNum(r.amount);
    }
    msg.className = 'msg ok'; msg.textContent = `✔ اتسجل ${saved} مصروف بإجمالي ${fmt(total)} ج`;
    const log = await apiGet('getDailyExpenses', { date: DSTATE.date });
    dRenderTodayLog(log.rows || []);
    DSTATE.rows = [dNewRow(), dNewRow(), dNewRow()];
    dRenderRows();
  } catch(err){
    msg.className = 'msg err'; msg.textContent = 'خطأ: ' + (err.message || err) + (saved ? ` (اتسجل ${saved} قبل ما يحصل الخطأ)` : '');
  } finally { btn.disabled = false; }
}
function dRenderTodayLog(rows){
  const box = document.getElementById('d-today-box'); if (!box) return;
  if (!rows.length){ box.innerHTML = '<div class="empty">لسه مفيش مصاريف مسجلة في اليوم ده</div>'; return; }
  const total = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  box.innerHTML = `
    <div style="margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:700;">إجمالي مصاريف اليوم: <span style="color:var(--red);">${fmt(total)} ج</span></div>
    <div class="tbl-wrap tbl-wrap-scroll"><table><thead><tr><th>البيان</th><th>المبلغ</th><th>التاريخ</th><th>المشروع</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${qEsc(r.desc)}</td><td style="color:var(--red)">${fmt(r.amount)} ج</td><td>${qEsc(r.date || '—')}</td><td>${qEsc(r.project || '—')}</td></tr>`).join('')}</tbody></table></div>`;
}

        })),

      };

}
function renderDynRows(){
  document.getElementById('materialsBox').innerHTML = materialRows.map((m,i) => `
    <div class="dyn-row material">
      <input autocomplete="off" placeholder="اسم المادة" value="${m.name}" oninput="materialRows[${i}].name=this.value; updateProdTotal();">
      <input autocomplete="off" type="number" placeholder="الكمية" value="${m.qty}" oninput="materialRows[${i}].qty=this.value; updateProdTotal();">
      <input autocomplete="off" placeholder="الوحدة" value="${m.unit}" oninput="materialRows[${i}].unit=this.value;">
      <input autocomplete="off" type="number" placeholder="سعر الوحدة" value="${m.unitPrice}" oninput="materialRows[${i}].unitPrice=this.value; updateProdTotal();">
      <span class="dyn-row-cost" id="matCost-${i}">—</span>
      <button type="button" class="btn btn-sm btn-danger" onclick="materialRows.splice(${i},1); renderDynRows();">✕</button>
    </div>`).join('');
  document.getElementById('laborBox').innerHTML = laborRows.map((l,i) => `
    <div class="dyn-row labor">
      <select onchange="laborRows[${i}].employee=this.value; updateProdTotal();"><option value="">اختار الموظف</option>${(window._empOptionsHtml||'').replace(`value="${l.employee}"`, `value="${l.employee}" selected`)}</select>
      <input autocomplete="off" type="number" placeholder="ساعات" value="${l.hours}" oninput="laborRows[${i}].hours=this.value; updateProdTotal();">
      <span class="dyn-row-cost" id="laborCost-${i}">—</span>
      <button type="button" class="btn btn-sm btn-outline" onclick="laborRows[${i}].showEvening=!laborRows[${i}].showEvening; renderDynRows();">${l.showEvening ? '− سهرة' : '+ سهرة'}</button>
      <button type="button" class="btn btn-sm btn-danger" onclick="laborRows.splice(${i},1); renderDynRows();">✕</button>
    </div>
    ${l.showEvening ? `
    <div class="evening-row">
      <input autocomplete="off" type="number" step="0.5" min="0" placeholder="ساعات السهرة (للسجل فقط)" value="${l.eveningHours}" oninput="laborRows[${i}].eveningHours=this.value; updateProdTotal();">
      <input autocomplete="off" type="number" step="1" min="0" placeholder="مبلغ السهرة (ج)" value="${l.eveningAmount}" oninput="laborRows[${i}].eveningAmount=this.value; updateProdTotal();">
      <button type="button" class="btn btn-sm btn-danger" onclick="laborRows[${i}].showEvening=false; laborRows[${i}].eveningHours=''; laborRows[${i}].eveningAmount=''; renderDynRows();">✕</button>
    </div>` : ''}`).join('');
  updateProdTotal();
}
function updateProdTotal(){
  let matTotal = 0;
  materialRows.forEach((m,i) => {
    const cost = (Number(m.qty)||0) * (Number(m.unitPrice)||0);
    matTotal += cost;
    const el = document.getElementById('matCost-'+i);
    if (el) el.textContent = cost ? fmt(cost)+' ج' : '—';
  });
  const rateMap = window._empRateMap || {};
  let laborTotal = 0;
  laborRows.forEach((l,i) => {
    const rate = rateMap[l.employee] || 0;
    const hours = Number(l.hours) || 0;
    const eveningAmount = Number(l.eveningAmount) || 0;
    const cost = (hours * rate) + eveningAmount;
    laborTotal += cost;
    const el = document.getElementById('laborCost-'+i);
    if (el) el.textContent = cost ? fmt(cost)+' ج' : '—';
  });
  const grand = matTotal + laborTotal;
  const totMat = document.getElementById('totMat'); if (totMat) totMat.textContent = fmt(matTotal) + ' ج';
  const totLabor = document.getElementById('totLabor'); if (totLabor) totLabor.textContent = fmt(laborTotal) + ' ج';
  const totGrand = document.getElementById('totGrand'); if (totGrand) totGrand.textContent = fmt(grand) + ' ج';
}

  const box = document.getElementById('productsListBox');
  if (!products.length){ box.innerHTML = '<div class="empty">مفيش منتجات مسجلة</div>'; return; }
  box.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>المنتج</th><th>المشروع</th><th>خامات</th><th>عمالة</th><th>الإجمالي</th><th></th></tr></thead>
    <tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${p.project}</td><td>${fmt(p.materialsCost)} ج</td><td>${fmt(p.laborCost)} ج</td><td><b>${fmt(p.totalCost)} ج</b></td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteProductConfirm('${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`;
}

/* ================= Quotation (عروض الأسعار) — full app ================= */
const QCFG = {
  categories: ['Doors','Reception','Bedroom','Bedroom 2','Living Room','Dressing','Pergola','Office','Toilet','Kitchen','Veneers','TV Unit','Table'],
  defaultDollar: '52',
  noteLines: [
    'الأسعار مرتبطة بسعر الدولار اليوم {DOLLAR} جنيه مصري وسعر البنزين وأي تغيير في تكلفة التشغيل يضاف في حينها.',
    'الأسعار وضحت بناءاً على الرسم الهندسي والـ 3D وأي تعديل في المقاسات أو التصميم يغير من الأسعار وقت التنفيذ.'
  ]
};
let QSTATE = { subpage:'home', customer:null, rows:[], discount:{percent:0,amount:0}, dollar:QCFG.defaultDollar };
let _qActionToken = 0; // بيتزود كل ما نبدأ عملية async جوه صفحة الكوتيشن — لو المستخدم غيّر الصفحة أو بدأ عملية تانية قبل ما القديمة تخلص، بنلغي كتابة النتيجة القديمة فوق الشاشة

const qEsc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const qNum = v => parseFloat((v+'').replace(/,/g,'')) || 0;
function qNewRow(){ return { _id:Math.random(), category:'', unit:'', description:'', qty:1, price:0, notes:'' }; }
// بيبني اسم ملف نظيف للـ PDF من اسم المشروع/العميل (بيشيل رموز ممنوعة في أسماء الملفات)
function pdfFileTitle(prefix, name){
  const clean = String(name || '').trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  return clean ? `${prefix} - ${clean}` : prefix;
}
// تحويل تاريخ الكوتيشن (صيغة d-M-yyyy أو d/M/yyyy) لصيغة ISO يفهمها input[type=date] والعكس
function qDateToISO(d){ if(!d) return ''; const p=String(d).trim().split(/[-\/]/); return p.length===3 ? `${p[2]}-${String(p[1]).padStart(2,'0')}-${String(p[0]).padStart(2,'0')}` : ''; }
function qDateFromISO(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3 ? `${Number(p[2])}-${Number(p[1])}-${p[0]}` : ''; }
function qPopulateCategoryList(){
  const dl = document.getElementById('q-cat-list');
  if (dl) dl.innerHTML = QCFG.categories.map(c => `<option value="${qEsc(c)}"></option>`).join('');
}

function qSaveSession(){
  try { sessionStorage.setItem('lm_quoteSession', JSON.stringify(QSTATE)); } catch(e){}
}
function qRestoreSession(){
  try {
    const raw = sessionStorage.getItem('lm_quoteSession');
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.customer || (s.subpage !== 'editor' && s.subpage !== 'preview')) return false;
    QSTATE = s;
    QSTATE.rows = (QSTATE.rows && QSTATE.rows.length) ? QSTATE.rows.map(r => ({...r, _id:Math.random()})) : [qNewRow()];
    QSTATE.discount = QSTATE.discount || {percent:0, amount:0};
    return true;
  } catch(e){ return false; }
}

async function renderQuotation(token){
  qPopulateCategoryList();
  if (qRestoreSession()) return QSTATE.subpage === 'preview' ? qRenderPreview() : qRenderEditor();
  QSTATE = { subpage:'home', customer:null, rows:[], discount:{percent:0,amount:0}, dollar:QCFG.defaultDollar };
  return qRenderHome(token);
}

async function qRenderHome(token){
  document.getElementById('content').innerHTML = '<div class="loading-row">جاري التحميل...</div>';
  const myTok = ++_qActionToken;
  try {

    document.getElementById('content').innerHTML = `

function qCreateQuote(){
  const eng = document.getElementById('q_engineer').value.trim();
  const adr = document.getElementById('q_address').value.trim();
  const dlr = document.getElementById('q_dollar').value || QCFG.defaultDollar;
  if (!eng && !adr) {
    const m = document.getElementById('qCreateMsg'); m.className='msg err'; m.textContent='برجاء إدخال موجه إلى أو العنوان'; return;
  }
  const name = [eng, adr].filter(Boolean).join(' - ');
  QSTATE = { subpage:'editor', customer:{ name, engineer:eng, address:adr }, rows:[qNewRow()], discount:{percent:0,amount:0}, dollar:dlr };
  qSaveSession();
  qRenderEditor();
}

async function qOpenCustomer(c){
  QSTATE.customer = c;
  document.getElementById('content').innerHTML = '<div class="loading-row">جاري تحميل الكوتيشن...</div>';
  const navSnap = _navToken; const myTok = ++_qActionToken;
  try {
    const d = await apiGet('quoteGetQuotation', { name: c.name });
    if (_navToken !== navSnap || _qActionToken !== myTok) return; // المستخدم غيّر الصفحة/فتح حاجة تانية قبل ما الطلب يخلص
    QSTATE.rows = (d.rows || []).map(r => ({...r, _id:Math.random()}));
    if (!QSTATE.rows.length) QSTATE.rows = [qNewRow()];
    QSTATE.discount = d.discount || {percent:0, amount:0};
    QSTATE.dollar = QSTATE.dollar || QCFG.defaultDollar;
    QSTATE.subpage = 'editor';
    qSaveSession();
    qRenderEditor();
  } catch(err){
    if (_navToken !== navSnap || _qActionToken !== myTok) return;
    QSTATE.rows = [qNewRow()]; QSTATE.discount = {percent:0,amount:0}; QSTATE.subpage = 'editor';
    qSaveSession(); qRenderEditor();
  }
}

async function qDeleteCustomer(name){
  if (!confirm('هل تريد حذف كوتيشن "'+name+'" نهائياً؟')) return;
  const navSnap = _navToken; const myTok = ++_qActionToken;
  try {
    await apiPost('quoteDeleteCustomer', { name });
    if (_navToken !== navSnap || _qActionToken !== myTok) return;
    qRenderHome();
  } catch(err){ alert('خطأ: '+(err.message||err)); }
}

function qGoHome(){ try{ sessionStorage.removeItem('lm_quoteSession'); }catch(e){} QSTATE = { subpage:'home', customer:null, rows:[], discount:{percent:0,amount:0}, dollar:QCFG.defaultDollar }; qRenderHome(); }
function qGoEditor(){ QSTATE.subpage = 'editor'; qSaveSession(); qRenderEditor(); }

/* ---- row helpers ---- */
function qTot(r){ return qNum(r.qty) * qNum(r.price); }
function qGrand(){ return QSTATE.rows.reduce((s,r) => s + qTot(r), 0); }
function qDiscountAmt(){
  const sub = qGrand(); let amt = qNum(QSTATE.discount && QSTATE.discount.amount);
  if (amt < 0) amt = 0; if (amt > sub) amt = sub; return amt;
}
function qNetTotal(){ return Math.max(0, qGrand() - qDiscountAmt()); }
function qAddRow(){ QSTATE.rows.push(qNewRow()); qRenderRows(); qSaveSession(); }
function qDelRow(id){ QSTATE.rows = QSTATE.rows.filter(r => r._id !== id); qRenderRows(); qSaveSession(); }
function qSetField(id, f, v){ const r = QSTATE.rows.find(r => r._id === id); if (r) r[f] = v; qRefreshTotals(); qSaveSession(); }
function qSetNumField(id, f, v){ const r = QSTATE.rows.find(r => r._id === id); if (r) r[f] = qNum(v); qRefreshTotals(); qSaveSession(); }

function qSetDiscount(field, value){
  const sub = qGrand(); const v = qNum(value);
  if (!QSTATE.discount) QSTATE.discount = {percent:0, amount:0};
  if (field === 'percent'){
    let p = v; if (p < 0) p = 0; if (p > 100) p = 100;
    QSTATE.discount.percent = p;
    QSTATE.discount.amount = sub > 0 ? Math.ceil(sub * p / 100) : 0;
  } else {
    let a = v; if (a < 0) a = 0; if (a > sub) a = sub;
    QSTATE.discount.amount = a;
    QSTATE.discount.percent = sub > 0 ? Math.ceil((a / sub) * 100) : 0;
  }
  qSyncDiscountInputs(); qRefreshTotals(); qSaveSession();
}
function qSyncDiscountInputs(){
  if (!QSTATE.discount) QSTATE.discount = {percent:0, amount:0};
  const pEl = document.getElementById('q-disc-percent'), aEl = document.getElementById('q-disc-amount');
  if (pEl && document.activeElement !== pEl) pEl.value = QSTATE.discount.percent || 0;
  if (aEl && document.activeElement !== aEl) aEl.value = QSTATE.discount.amount || 0;
}
function qRefreshTotals(){
  QSTATE.rows.forEach((r,i) => {
    const cells = document.querySelectorAll('#q-body tr')[i] ? document.querySelectorAll('#q-body tr')[i].querySelectorAll('td') : null;
    if (cells) cells[6].textContent = fmt(qTot(r));
  });
  const sub = qGrand(), dAmt = qDiscountAmt(), p = (QSTATE.discount && QSTATE.discount.percent) || 0;
  const summary = document.getElementById('q-dc-summary');
  if (summary) summary.style.display = dAmt > 0 ? 'block' : 'none';
  const subEl = document.getElementById('q-dc-subtotal'); if (subEl) subEl.textContent = fmt(sub) + ' جنيه';
  const pLbl = document.getElementById('q-dc-percent-lbl'); if (pLbl) pLbl.textContent = 'الخصم (' + fmt(p) + '%)';
  const dEl = document.getElementById('q-dc-discount-val'); if (dEl) dEl.textContent = '- ' + fmt(dAmt) + ' جنيه';
  const netEl = document.getElementById('q-dc-net'); if (netEl) netEl.textContent = fmt(qNetTotal()) + ' جنيه';
  const grandEl = document.getElementById('q-grand-total'); if (grandEl) grandEl.textContent = fmt(qNetTotal()) + ' جنيه';
}

function qRenderRows(){
  const tb = document.getElementById('q-body'); if (!tb) return;
  tb.innerHTML = QSTATE.rows.map((r,i) => `
    <tr>
      <td style="text-align:center;color:var(--muted);font-size:11px;">${i+1}</td>
      <td><input autocomplete="off" type="text" list="q-cat-list" value="${qEsc(r.category)}" placeholder="DOORS"
        onchange="qSetField(${r._id},'category',this.value)"></td>
      <td><input autocomplete="off" type="text" value="${qEsc(r.unit)}" placeholder="الوحده" onchange="qSetField(${r._id},'unit',this.value)"></td>
      <td><textarea placeholder="اكتب وصف العمل هنا..." onchange="qSetField(${r._id},'description',this.value)">${qEsc(r.description)}</textarea></td>
      <td><input autocomplete="off" type="text" class="ltr-num" inputmode="numeric" value="${r.qty}" onchange="qSetNumField(${r._id},'qty',this.value)" onkeypress="return /[0-9.]/.test(event.key)"></td>
      <td><input autocomplete="off" type="text" class="ltr-num" inputmode="numeric" value="${r.price}" onchange="qSetNumField(${r._id},'price',this.value)" onkeypress="return /[0-9.]/.test(event.key)"></td>
      <td class="num-cell">${fmt(qTot(r))}</td>
      <td><textarea placeholder="ملاحظة..." onchange="qSetField(${r._id},'notes',this.value)">${qEsc(r.notes)}</textarea></td>
      <td><button class="btn btn-sm btn-danger" onclick="qDelRow(${r._id})">✕</button></td>
    </tr>`).join('');
  qRefreshTotals();
}

  const c = QSTATE.customer || {};
  if (QSTATE.customer && !c.date) c.date = qDateFromISO(todayStr());
  document.getElementById('content').innerHTML = `
    <div class="q-steps">
      <div class="step done" onclick="qGoHome()">← الرئيسية</div>
      <div class="step active">تحرير الكوتيشن</div>
      <div class="step">معاينة وطباعة</div>
    </div>
    <div class="panel" style="padding:18px 22px;">
      <div class="q-banner">
        <div class="q-info-box">
          <div class="q-info-row"><label>موجه إلى:</label><input autocomplete="off" type="text" id="q-b-engineer" value="${qEsc(c.engineer)}"
            oninput="QSTATE.customer.engineer=this.value; qSaveSession();"></div>
          <div class="q-info-row"><label>العنوان / المشروع:</label><input autocomplete="off" type="text" id="q-b-address" value="${qEsc(c.address)}"
            oninput="QSTATE.customer.address=this.value; qSaveSession();"></div>

async function qSaveQuotation(){
  const btn = document.getElementById('qSaveBtn'); const msg = document.getElementById('qSaveMsg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>جاري الحفظ...';
  try {
    const dlr = QSTATE.dollar || QCFG.defaultDollar;
    const d = await apiPost('quoteSaveQuotation', {
      customer: QSTATE.customer,
      rows: QSTATE.rows.map(r => ({...r, total: qTot(r)})),
      subtotal: qGrand(), discount: QSTATE.discount, grandTotal: qNetTotal(),
      dollar: dlr,
      noteLines: QCFG.noteLines.map(l => l.replace('{DOLLAR}', dlr))
    });
    d.success !== false
      ? (msg.className='msg ok', msg.textContent='✔ تم الحفظ في Google Sheets بنجاح')

function friendlyMailError(raw){
  raw = raw || 'حدث خطأ غير متوقع، حاول تاني';
  if(/external_request|UrlFetchApp|ليس لديك إذن|authorization/i.test(raw)){
    return 'السكريبت محتاج إعادة تفويض صلاحية الاتصال الخارجي (external_request) من مالك مشروع Apps Script. افتح محرر Apps Script → شغّل أي فانكشن يدويًا → وافق على كل الصلاحيات المطلوبة → أعد نشر الـ Web App (Deploy → Manage deployments → Edit → New version).';
  }
  return raw;
}

/* ================= Debtors / Payment Statement — full app (Home → متابعة دفعات → معاينة/طباعة/إيميل) ================= */
/* ── تحويل رقم لصيغة الترتيب العربي المؤنث (الأولى، الثانية عشر، الحادية والعشرون، الثلاثون...) بلا حد أقصى عمليًا ── */
function arabicOrdinalFem(n){
  const units      = ['', 'الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة'];
  const compUnits  = ['', 'الحادية','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة']; // زي units إلا الواحد بيتغير جوه الأعداد المركبة
  const tensWords  = ['', '', 'العشرون','الثلاثون','الأربعون','الخمسون','الستون','السبعون','الثمانون','التسعون'];
  const hundreds   = ['', 'المئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];

  function twoDigits(n){ // 1..99
    if (n === 0) return '';
    if (n < 10) return units[n];
    if (n === 10) return 'العاشرة';
    if (n < 20) return compUnits[n - 10] + ' عشر';
    const t = Math.floor(n / 10), u = n % 10;
    return u === 0 ? tensWords[t] : (compUnits[u] + ' و' + tensWords[t]);
  }
  function threeDigits(n){ // 1..999
    const h = Math.floor(n / 100), rem = n % 100;
    if (h === 0) return twoDigits(rem);
    const hWord = hundreds[h];
    return rem === 0 ? hWord : (hWord + ' و' + twoDigits(rem));
  }

  if (n <= 0) return '';
  if (n < 1000) return threeDigits(n);
  return 'رقم ' + n; // لأعداد كبيرة جدًا (نادر الحدوث) بنرجع لصياغة رقمية واضحة بدل صياغة معقدة
}
function pOrdinalName(i){ const n = i + 1; return 'الدفعة ' + arabicOrdinalFem(n) + ' (' + n + ')'; }
const P_OLD_ORDINALS = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة',
  'الحادية عشر','الثانية عشر','الثالثة عشر','الرابعة عشر','الخامسة عشر','السادسة عشر','السابعة عشر','الثامنة عشر','التاسعة عشر','العشرون'];
// بيحول أي اسم دفعة اتحط تلقائي بأي صيغة قديمة (كلام، أو "رقم N"، أو "(N)") للصيغة الحالية — وبيسيب أي اسم كتبه المستخدم يدويًا زي ما هو
function pMigrateRowName(name, idx){
  const s = String(name||'').trim();
  if (!s) return pOrdinalName(idx);
  const isOldAuto = P_OLD_ORDINALS.some(o => s === 'الدفعة ' + o)
    || /^الدفعة رقم\s*\d+$/.test(s)
    || /^الدفعة\s*\(\d+\)$/.test(s)
    || /^الدفعة\s+.+\s+\(\d+\)$/.test(s);
  return isOldAuto ? pOrdinalName(idx) : s;
}
function pNewRow(idx){ return { _id:Math.random(), name: pOrdinalName(idx), amount:0, date:'', method:'' }; }
const pToISO = d => { if(!d) return ''; const p=(d||'').split('/'); return p.length===3 ? `${p[2]}-${p[1]}-${p[0]}` : ''; };
const pToEnGB = iso => { if(!iso) return ''; const p=iso.split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
function pTodayEnGB(){ return pToEnGB(new Date().toISOString().slice(0,10)); }

let PSTATE = { subpage:'home', customer:null, rows:[] };
let _pActionToken = 0; // نفس فكرة _qActionToken بس لصفحة الـ Payment Statements
let _pHomeCustomers = []; // آخر قائمة عملاء اتحملت في صفحة السجلات السابقة
let _pHomeFilter = 'all'; // 'all' | 'completed' | 'incomplete' — حالة دروب داون الفلتر فوق السجلات

function pSaveSession(){ try { sessionStorage.setItem('lm_paySession', JSON.stringify(PSTATE)); } catch(e){} }
function pRestoreSession(){
  try {
    const raw = sessionStorage.getItem('lm_paySession');
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.customer || (s.subpage !== 'editor' && s.subpage !== 'preview')) return false;
    PSTATE = s;
    PSTATE.rows = (PSTATE.rows && PSTATE.rows.length) ? PSTATE.rows.map((r,i) => ({...r, name: pMigrateRowName(r.name, i), _id:Math.random()})) : [pNewRow(0)];
    return true;
  } catch(e){ return false; }
}

  if (pRestoreSession()) return PSTATE.subpage === 'preview' ? pRenderPreview() : pRenderEditor();
  PSTATE = { subpage:'home', customer:null, rows:[] };
  return pRenderHome(token);
}

  document.getElementById('content').innerHTML = '<div class="loading-row">جاري التحميل...</div>';
  const myTok = ++_pActionToken;
  try {
    const { customers } = await apiGet('payListCustomers');
    if (isStaleNav(token) || _pActionToken !== myTok) return;
    _pHomeCustomers = customers;
    document.getElementById('content').innerHTML = `
      <div class="panel">
        <h3>إنشاء سجل دفعات جديد</h3>
        <div class="msg" id="pCreateMsg"></div>
        <form class="form-row3" onsubmit="event.preventDefault(); pCreateRecord();">
          <div class="field"><label>موجه إلى (Engineer)</label><input type="text" autocomplete="off" id="p_engineer"></div>
          <div class="field"><label>العنوان / المشروع</label><input type="text" autocomplete="off" id="p_address"></div>
          <div class="field"><label>المبلغ الإجمالي</label><input type="text" autocomplete="off" inputmode="numeric" id="p_total" placeholder="0" onkeypress="return /[0-9.]/.test(event.key)"></div>
        </form>
        <div style="margin-top:16px;display:flex;justify-content:flex-end;">
          <button class="btn btn-primary" onclick="pCreateRecord()">✦ إنشاء وبدء المتابعة</button>
        </div>
      </div>
      <div class="panel" id="p-list-panel"></div>
    `;
    pRenderClistPanel();
  } catch(err){ showError(err); }
}

function pSetHomeFilter(val){
  _pHomeFilter = val;
  pRenderClistPanel();
}

function pRenderClistPanel(){
  const panel = document.getElementById('p-list-panel'); if (!panel) return;
  const customers = _pHomeCustomers;
  const completedCount = customers.filter(c => c.completed).length;
  const filter = _pHomeFilter;
  const visible = filter === 'completed' ? customers.filter(c => c.completed)
                : filter === 'incomplete' ? customers.filter(c => !c.completed)
                : customers;
  const sorted = [...visible].sort((a,b) => {
    if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1; // المكتمل ينزل تحت
    return String(b.date||'').localeCompare(String(a.date||'')); // الأحدث فوق داخل كل مجموعة
  });
  const emptyMsg = filter === 'completed' ? 'مفيش سجلات مكتملة الدفع'
                 : filter === 'incomplete' ? 'مفيش سجلات لسه مكملتش الدفع'
                 : 'مفيش سجلات لسه';
  const incompleteCount = customers.length - completedCount;
  panel.innerHTML = `
    <h3>السجلات السابقة (${customers.length})</h3>
    <div class="q-steps p-filter-tabs">
      <div class="step ${filter==='all'?'active':''}" onclick="pSetHomeFilter('all')">الجميع (${customers.length})</div>
      <div class="step ${filter==='completed'?'active':''}" onclick="pSetHomeFilter('completed')">مكتمل (${completedCount})</div>
      <div class="step ${filter==='incomplete'?'active':''}" onclick="pSetHomeFilter('incomplete')">غير مكتمل (${incompleteCount})</div>
    </div>
    <div class="q-clist" style="animation:contentIn .35s var(--bounce);">
    ${sorted.length ? sorted.map(c => {
      const remaining = (Number(c.total)||0) - (Number(c.received)||0);
      const pct = c.total > 0 ? Math.min(100, (Number(c.received)||0)/c.total*100) : 0;
      return `
      <div class="c-item ${c.completed ? 'is-completed' : ''}">
        <div class="ci-info" onclick='pOpenCustomer(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
          <div class="ci-name">${qEsc(c.engineer || c.name)}</div>
          <div class="ci-meta">${qEsc(c.address || '')}</div>
          <div class="ci-progress">
            <span>آخر دفعة: <b>${qEsc(c.lastPayment || '—')}</b></span>
            <span>الإجمالي: <b>${fmt(c.total)}</b></span>
            <span>المستلم: <b>${fmt(c.received)}</b></span>
            <span>الباقي: <b style="color:${Math.abs(remaining)<=0.01?'var(--green)':'var(--red)'};">${fmt(remaining)}</b></span>
            <span>النسبة: <b>${pct.toFixed(0)}%</b></span>
          </div>
        </div>
        <div class="ci-actions">
          <button class="ci-badge" onclick='pOpenCustomer(${JSON.stringify(c).replace(/'/g,"&#39;")})'>فتح ←</button>
          <button class="btn btn-sm btn-danger" onclick="pDeleteCustomer('${c.name.replace(/'/g,"\\'")}')">🗑 حذف</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty">${emptyMsg}</div>`}
    </div>
  `;
}

function pCreateRecord(){
  const eng = document.getElementById('p_engineer').value.trim();
  const adr = document.getElementById('p_address').value.trim();
  const total = qNum(document.getElementById('p_total').value);
  if (!eng && !adr) {
    const m = document.getElementById('pCreateMsg'); m.className='msg err'; m.textContent='برجاء إدخال موجه إلى أو العنوان'; return;
  }
  const name = [eng, adr].filter(Boolean).join(' - ');
  PSTATE = { subpage:'editor', customer:{ name, engineer:eng, address:adr, total, completed:false, date: pTodayEnGB() }, rows:[pNewRow(0)] };
  pSaveSession();
  pRenderEditor();
}

async function pOpenCustomer(c){
  PSTATE.customer = c;
  document.getElementById('content').innerHTML = '<div class="loading-row">جاري تحميل السجل...</div>';
  const navSnap = _navToken; const myTok = ++_pActionToken;
  try {
    const d = await apiGet('payGetCashFlow', { name: c.name });
    if (_navToken !== navSnap || _pActionToken !== myTok) return; // المستخدم غيّر الصفحة/فتح حاجة تانية قبل ما الطلب يخلص
    PSTATE.rows = (d.rows || []).map((r,i) => ({...r, name: pMigrateRowName(r.name, i), _id:Math.random()}));
    if (!PSTATE.rows.length) PSTATE.rows = [pNewRow(0)];
    PSTATE.customer.completed = !!d.completed;
    PSTATE.subpage = 'editor';
    pSaveSession();
    pRenderEditor();
  } catch(err){
    if (_navToken !== navSnap || _pActionToken !== myTok) return;
    PSTATE.rows = [pNewRow(0)]; PSTATE.subpage = 'editor'; pSaveSession(); pRenderEditor();
  }
}

async function pDeleteCustomer(name){
  if (!confirm('هل تريد حذف سجل "'+name+'" نهائياً؟')) return;
  const navSnap = _navToken; const myTok = ++_pActionToken;
  try {
    await apiPost('payDeleteCustomer', { name });
    if (_navToken !== navSnap || _pActionToken !== myTok) return;
    pRenderHome();
  } catch(err){ alert('خطأ: '+(err.message||err)); }
}

function pGoHome(){ try{ sessionStorage.removeItem('lm_paySession'); }catch(e){} PSTATE = { subpage:'home', customer:null, rows:[] }; pRenderHome(); }
function pGoEditor(){ PSTATE.subpage = 'editor'; pSaveSession(); pRenderEditor(); }

/* ---- row helpers ---- */
function pReceived(){ return PSTATE.rows.reduce((s,r) => s + qNum(r.amount), 0); }
function pAddRow(){ PSTATE.rows.push(pNewRow(PSTATE.rows.length)); pRenderRows(); pSaveSession(); }
function pDelRow(id){ PSTATE.rows = PSTATE.rows.filter(r => r._id !== id); pRenderRows(); pSaveSession(); }
function pSetField(id, f, v){ const r = PSTATE.rows.find(r => r._id === id); if (r) r[f] = v; pSaveSession(); }
function pSetAmount(id, v){
  const r = PSTATE.rows.find(r => r._id === id); if (!r) return;
  const val = qNum(v); r.amount = val;
  if (val > 0 && !r.date) r.date = pTodayEnGB();
  else if (val <= 0) r.date = '';
  pRenderRows(); pSaveSession();
}
function pSetDate(id, isoVal){ const r = PSTATE.rows.find(r => r._id === id); if (!r) return; r.date = pToEnGB(isoVal); pRenderRows(); pSaveSession(); }

function pRefreshTotals(){
  const total = qNum(document.getElementById('p-b-total').value);
  const received = pReceived();
  const remaining = total - received;
  const totalEl = document.getElementById('p-total-amt'); if (totalEl) totalEl.textContent = fmt(total) + ' جنيه';
  const recEl = document.getElementById('p-received-amt'); if (recEl) recEl.textContent = fmt(received) + ' جنيه';
  const remEl = document.getElementById('p-remaining-amt'); if (remEl) remEl.textContent = fmt(remaining) + ' جنيه';
  const bar = document.getElementById('p-remaining-bar'); if (bar) bar.classList.toggle('done', Math.abs(remaining) <= 0.01);

  // إتمام الدفع تلقائيًا لما نوصل 100%
  const isComplete = total > 0 && Math.abs(remaining) <= 0.01;
  if (PSTATE.customer) PSTATE.customer.completed = isComplete;
  const box = document.getElementById('p-complete-box'); if (box) box.classList.toggle('complete', isComplete);
  const msg = document.getElementById('p-complete-msg'); if (msg) msg.classList.toggle('show', isComplete);
  const incMsg = document.getElementById('p-incomplete-msg'); if (incMsg) incMsg.style.display = isComplete ? 'none' : '';
  pSaveSession();
}

function pRenderRows(){
  const tb = document.getElementById('p-body'); if (!tb) return;
  const total = qNum(document.getElementById('p-b-total').value);
  let cumulative = 0;
  tb.innerHTML = PSTATE.rows.map((r,i) => {
    const amt = qNum(r.amount); let pct = '';
    if (amt > 0) { cumulative += amt; pct = total > 0 ? Math.min(100, (cumulative/total)*100) : 0; }
    return `
    <tr>
      <td style="text-align:center;color:var(--muted);font-size:11px;">${i+1}</td>
      <td><input type="text" autocomplete="off" name="p-name-${r._id}" value="${qEsc(r.name)}" onchange="pSetField(${r._id},'name',this.value)" placeholder="${qEsc(pOrdinalName(i))}"></td>
      <td><input type="text" autocomplete="off" name="p-amount-${r._id}" class="ltr-num" inputmode="numeric" value="${r.amount||''}" onchange="pSetAmount(${r._id},this.value)" onkeypress="return /[0-9.]/.test(event.key)"></td>
      <td class="num-cell">${pct!==''?pct.toFixed(0)+'%':'—'}</td>
      <td><input autocomplete="off" type="date" value="${pToISO(r.date)}" onchange="pSetDate(${r._id},this.value)" style="direction:ltr;width:132px;"></td>
      <td><input type="text" autocomplete="off" name="p-method-${r._id}" value="${qEsc(r.method||'')}" onchange="pSetField(${r._id},'method',this.value)" placeholder="اختياري"></td>
      <td><button class="btn btn-sm btn-danger" onclick="pDelRow(${r._id})">✕</button></td>
    </tr>`;
  }).join('');
  pRefreshTotals();
}

async function pSaveCashFlow(){
  const btn = document.getElementById('pSaveBtn'); const msg = document.getElementById('pSaveMsg');
  PSTATE.customer.total = qNum(document.getElementById('p-b-total').value);
  const total = PSTATE.customer.total; const remaining = total - pReceived();
  PSTATE.customer.completed = total > 0 && Math.abs(remaining) <= 0.01;
  PSTATE.customer.date = pToEnGB(document.getElementById('p-b-date').value);
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>جاري الحفظ...';
  try {
    const d = await apiPost('paySaveCashFlow', { customer: PSTATE.customer, rows: PSTATE.rows, received: pReceived() });
    d.success !== false
      ? (msg.className='msg ok', msg.textContent='✔ تم الحفظ في Google Sheets بنجاح')
      : (msg.className='msg err', msg.textContent='خطأ: ' + (d.error || 'غير معروف'));
  } catch(err){ msg.className='msg err'; msg.textContent='تعذر الاتصال: ' + (err.message||err); }
  finally { btn.disabled = false; btn.textContent = '💾 حفظ في الشيت'; }
}

    <div class="panel" style="padding:12px 16px;margin-bottom:0;">
      <div class="action-bar" style="display:flex;flex-wrap:wrap;gap:10px;">
        <button class="btn btn-outline" onclick="pGoEditor()">← تعديل</button>
        <button class="btn btn-dark" onclick="pOpenMailPrompt()">✉ إرسال بالإيميل</button>
        <button class="btn btn-primary" onclick="pPrintPreview()">⬇ تحميل وطباعة PDF</button>
      </div>
    </div>
    <div class="q-preview-box"><iframe id="pPreviewFrame" class="q-preview-frame"></iframe></div>

    <div id="pMailModal">
      <div class="q-confirm-card">
        <h3>إرسال كشف الدفعات بالإيميل</h3>
        <p>اكتب إيميل العميل أو المهندس لإرسال كشف الـ Payment Statement</p>
        <div class="field" style="margin-bottom:16px;"><input autocomplete="off" type="email" id="pMailTo" placeholder="example@email.com" style="direction:ltr;text-align:left;"></div>
        <div class="msg" id="pMailStatus" style="margin-bottom:14px;"></div>
        <div class="q-confirm-btns">
          <button class="btn btn-primary" id="pMailSendBtn" onclick="pSendMailNow()">إرسال</button>
          <button class="btn btn-outline" onclick="pCloseMailModal()">إلغاء</button>
        </div>
      </div>
    </div>
  `;
  const frame = document.getElementById('pPreviewFrame');
  frame.addEventListener('load', () => {
    try { frame.style.height = (frame.contentDocument.documentElement.scrollHeight + 20) + 'px'; } catch(e){ frame.style.height = '1200px'; }
  });
  frame.srcdoc = pBuildPdfHtml();
}

function pPrintPreview(){
  const frame = document.getElementById('pPreviewFrame');
  if (!frame || !frame.contentWindow) return;
  const c = PSTATE.customer || {};
  const originalTitle = document.title;
  document.title = pdfFileTitle('Payment Statement', c.address || c.name);
  const restore = () => { document.title = originalTitle; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  frame.contentWindow.focus();
  frame.contentWindow.print();
  setTimeout(restore, 3000); // fallback لو afterprint ما اتطلقتش لأي سبب
}

function pOpenMailPrompt(){
  document.getElementById('pMailTo').value = '';
  document.getElementById('pMailStatus').style.display = 'none';
  document.getElementById('pMailModal').classList.add('open');
}
function pCloseMailModal(){ document.getElementById('pMailModal').classList.remove('open'); }

async function pSendMailNow(){
  const to = document.getElementById('pMailTo').value.trim();
  const statusEl = document.getElementById('pMailStatus');
  const inputEl = document.getElementById('pMailTo');
  const show = (type, msg) => { statusEl.className = 'msg ' + (type === 'ok' ? 'ok' : 'err'); statusEl.textContent = msg; statusEl.style.display = 'block'; };
  inputEl.style.borderColor = '';
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!to || !emailRegex.test(to)) { inputEl.style.borderColor = '#c0392b'; show('err', '⚠ من فضلك اكتب إيميل صحيح'); inputEl.focus(); return; }
  const hasValidRow = PSTATE.rows.some(r => qNum(r.amount) > 0);
  if (!hasValidRow) { show('err', '⚠ السجل فاضي، من فضلك أضف دفعات قبل الإرسال'); return; }
  if (!PSTATE.customer || (!PSTATE.customer.engineer && !PSTATE.customer.address)) { show('err', '⚠ بيانات العميل ناقصة، رجّع وعدّل قبل الإرسال'); return; }
  const btn = document.getElementById('pMailSendBtn'); btn.disabled = true; show('ok', '⏳ جاري الإرسال...');
  try {
    const d = await apiPost('paySendEmailCashFlow', {
      to, subject: 'Payment Statement - Living Mood',
      rows: PSTATE.rows, customer: PSTATE.customer, total: qNum(PSTATE.customer.total), received: pReceived()
    });
    if (d.success !== false) { show('ok', '✔ تم إرسال كشف الدفعات بنجاح'); setTimeout(pCloseMailModal, 1800); }
    else { inputEl.style.borderColor = '#c0392b'; show('err', '✕ ' + friendlyMailError(d.error)); }
  } catch(err){ show('err', '✕ تعذر الاتصال بالسيرفر: ' + friendlyMailError(err.message||String(err))); }
  finally { btn.disabled = false; }
}

/* ================= Login ================= */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg'; msg.textContent = '';
  const name = document.getElementById('l_name').value.trim();
  const pass = document.getElementById('l_pass').value.trim();
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>جاري الدخول...';
  try {
    await apiGet('login', { name, pass }); // apiGet بيرمي Error لو data.error موجودة
    localStorage.setItem('lm_loggedIn', '1');
    localStorage.setItem('lm_userName', name);
    document.getElementById('loginWrap').remove(); // مش hide بس — لازم يتشال من الـ DOM خالص عشان كروم يبطل يقترح باسورد "Hazem" المحفوظ في أي حقل تاني في الصفحة
    document.getElementById('appRoot').style.display = 'flex';
    goTo(sessionStorage.getItem('lm_currentPage') || 'dashboard');
  } catch (err) {
    const m = err.message || String(err);
    msg.className = 'msg err';
    msg.textContent = _isNetworkError(m) ? '⚠️ مفيش اتصال بالإنترنت — تأكد من النت وحاول تاني' : 'خطأ: ' + m;
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

/* ================= Logout / Change Password ================= */
function pwToggle(btn){
  const input = btn.previousElementSibling;
  if (!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
}

let _genConfirmCallback = null;
function openGenConfirm(message, onConfirm, title){
  document.getElementById('genConfirmTitle').textContent = title || 'تأكيد';
  document.getElementById('genConfirmMsg').textContent = message;
  _genConfirmCallback = onConfirm;
  document.getElementById('genConfirmModal').classList.add('open');
}
function closeGenConfirm(){
  document.getElementById('genConfirmModal').classList.remove('open');
  _genConfirmCallback = null;
}
function _genConfirmRun(){
  const cb = _genConfirmCallback;
  closeGenConfirm();
  if (cb) cb();
}

function logout(){
  openGenConfirm('هل تريد تسجيل الخروج؟', () => {
    localStorage.removeItem('lm_loggedIn');
    localStorage.removeItem('lm_userName');
    sessionStorage.clear();
    window.location.reload(); // بديل بسيط وآمن بدل إظهار فورم اللوجن تاني، وبيضمن مفيش أي بواقي من الصفحة القديمة تأثر على كروم
  }, 'تسجيل الخروج');
}

function openChangePassModal(){
  document.getElementById('cp-old').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-confirm').value = '';
  document.getElementById('cpStatus').style.display = 'none';
  document.getElementById('changePassModal').classList.add('open');
}
function closeChangePassModal(){ document.getElementById('changePassModal').classList.remove('open'); }

async function submitChangePassword(){
  const oldPass = document.getElementById('cp-old').value.trim();
  const newPass = document.getElementById('cp-new').value.trim();
  const confirmPass = document.getElementById('cp-confirm').value.trim();
  const statusEl = document.getElementById('cpStatus');
  const show = (type, msg) => { statusEl.className = 'msg ' + (type === 'ok' ? 'ok' : 'err'); statusEl.textContent = msg; statusEl.style.display = 'block'; };
  if (!oldPass || !newPass || !confirmPass) { show('err', 'من فضلك اكتب كل الحقول'); return; }
  if (newPass !== confirmPass) { show('err', 'كلمة السر الجديدة والتأكيد مش متطابقين'); return; }
  if (newPass.length < 4) { show('err', 'كلمة السر الجديدة قصيرة أوي (4 حروف/أرقام على الأقل)'); return; }
  const name = localStorage.getItem('lm_userName') || '';
  if (!name) { show('err', 'حصل خطأ، برجاء تسجيل الخروج والدخول تاني'); return; }
  const btn = document.getElementById('cpSaveBtn'); btn.disabled = true; show('ok', '⏳ جاري الحفظ...');
  try {
    const d = await apiPost('changePassword', { name, oldPass, newPass });
    if (d.success) { show('ok', '✔ اتغيرت كلمة السر بنجاح'); setTimeout(closeChangePassModal, 1500); }
    else { show('err', '✕ ' + (d.error || 'حصل خطأ غير متوقع')); }
  } catch(err){ show('err', '✕ تعذر الاتصال بالسيرفر: ' + (err.message||err)); }
  finally { btn.disabled = false; }
}

/* ================= Init ================= */
if (localStorage.getItem('lm_loggedIn') === '1') {
  document.getElementById('loginWrap').remove();
  document.getElementById('appRoot').style.display = 'flex';
  goTo(sessionStorage.getItem('lm_currentPage') || 'dashboard');
} else {
  document.getElementById('l_name').focus();
}
</script>
